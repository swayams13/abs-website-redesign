<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
</helmet>
<header style="position:sticky;top:0;z-index:60;background:rgba(13,14,13,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(242,242,243,.14);font-family:Barlow,system-ui,sans-serif">
  <div style="max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,44px);height:70px;display:flex;align-items:center;justify-content:space-between;gap:28px">
    <a href="ABS-Home v4.dc.html" style="display:flex;align-items:center;text-decoration:none;flex-shrink:0">
      <img src="assets/abs-logo.png" alt="ABS Fitness" style="height:34px;width:auto;display:block;mix-blend-mode:screen">
    </a>

    <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:clamp(14px,2.4vw,34px)">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
          <a href="{{ it.href }}" style="position:relative;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#f2f2f3;text-decoration:none;padding:6px 0">
            {{ it.label }}
            <sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}">
              <span style="position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#b8e600"></span>
            </sc-if>
          </a>
        </sc-for>
        <a href="ABS-Home v4.dc.html#join" style="position:relative;background:#b8e600;color:#0d0e0d;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:13px 22px;text-decoration:none;flex-shrink:0">
          Join Now
          <i style="position:absolute;top:-5px;left:-5px;width:10px;height:10px;background:linear-gradient(#b8e600,#b8e600) center/1px 100% no-repeat,linear-gradient(#b8e600,#b8e600) center/100% 1px no-repeat"></i>
          <i style="position:absolute;top:-5px;right:-5px;width:10px;height:10px;background:linear-gradient(#b8e600,#b8e600) center/1px 100% no-repeat,linear-gradient(#b8e600,#b8e600) center/100% 1px no-repeat"></i>
          <i style="position:absolute;bottom:-5px;left:-5px;width:10px;height:10px;background:linear-gradient(#b8e600,#b8e600) center/1px 100% no-repeat,linear-gradient(#b8e600,#b8e600) center/100% 1px no-repeat"></i>
          <i style="position:absolute;bottom:-5px;right:-5px;width:10px;height:10px;background:linear-gradient(#b8e600,#b8e600) center/1px 100% no-repeat,linear-gradient(#b8e600,#b8e600) center/100% 1px no-repeat"></i>
        </a>
      </nav>
    </sc-if>

    <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ toggle }}" aria-label="Menu" style="display:flex;flex-direction:column;justify-content:center;gap:5px;width:46px;height:46px;padding:0 11px;background:transparent;border:1px solid rgba(242,242,243,.28);cursor:pointer">
        <span style="display:block;height:2px;background:#b8e600"></span>
        <span style="display:block;height:2px;background:#f2f2f3"></span>
        <span style="display:block;height:2px;background:#f2f2f3"></span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid rgba(242,242,243,.14);background:#0d0e0d;padding:10px clamp(16px,4vw,44px) 26px;display:flex;flex-direction:column">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
        <a href="{{ it.href }}" onClick="{{ close }}" style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;letter-spacing:.02em;text-transform:uppercase;color:#f2f2f3;text-decoration:none;padding:13px 0;border-bottom:1px solid rgba(242,242,243,.1)">{{ it.label }}</a>
      </sc-for>
      <a href="ABS-Home v4.dc.html#join" onClick="{{ close }}" style="margin-top:20px;text-align:center;background:#b8e600;color:#0d0e0d;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:16px;text-decoration:none">Join Now</a>
      <div style="margin-top:16px;font-size:13px;color:rgba(242,242,243,.6)">Call <a href="tel:+919763215051" style="color:#b8e600;text-decoration:none">+91 97632 15051</a></div>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;locations&quot;,&quot;trainers&quot;,&quot;passport&quot;,&quot;franchise&quot;,&quot;about&quot;,&quot;events&quot;,&quot;careers&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1280, open: false };
  componentDidMount() {
    this._r = () => this.setState({ w: window.innerWidth, open: false });
    window.addEventListener('resize', this._r);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const a = this.props.active || '';
    const wide = this.state.w >= 1060;
    return {
      wide, narrow: !wide, open: !wide && this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open })),
      close: () => this.setState({ open: false }),
      items: [
        { label: 'Home', href: 'ABS-Home v4.dc.html', on: a === 'home' },
        { label: 'About', href: 'ABS-About.dc.html', on: a === 'about' },
        { label: 'Locations', href: 'ABS-Locations.dc.html', on: a === 'locations' },
        { label: 'Programs', href: 'ABS-Trainers-Programs.dc.html', on: a === 'trainers' },
        { label: 'Events', href: 'ABS-Events.dc.html', on: a === 'events' },
        { label: 'Franchise', href: 'ABS-Franchise.dc.html', on: a === 'franchise' },
        { label: 'Contact', href: 'ABS-Contact.dc.html', on: a === 'contact' }
      ]
    };
  }
}
</script>
</body>
</html>
